[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6"

[profile.release]
lto = true
codegen-units = 1


# The wasm bundle is tuned for size; the native tools keep the default speed-oriented build.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true

# Card rendering and image encoding are slow without optimisation, even in tests.
[profile.dev.package."*"]
opt-level = 2

# Its image and card code is generic over the dependencies, so it is compiled here and needs the same.
[profile.dev.package.cookbook-cli]
opt-level = 2
