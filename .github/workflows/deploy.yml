name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  # A docs-only push skips the build jobs, so CI succeeds without a site to publish.
  site:
    # A manual run of CI on main (Actions > CI > Run workflow) deploys too, in either mode.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      built: ${{ steps.artifact.outputs.built }}
    steps:
      - id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" \
            --jq '[.artifacts[] | select(.name == "site" and (.expired | not))] | length')
          echo "built=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: site
    if: needs.site.outputs.built == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Take the site that CI built, tested and verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: web/build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/build
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
