name: CI

on:
  pull_request:
    branches: [main]
    # A label added or removed (fast-ci) runs CI again in the matching mode.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full runs every job; fast checks the content, builds and deploys, skipping the Rust tests, the web checks and the browser tests'
        type: choice
        options: [full, fast]
        default: full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1
  NODE_VERSION: 24.21.0
  WASM_BINDGEN_VERSION: 0.2.129
  BINARYEN_VERSION: '128'
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    # To find the merged pull request and its CI run.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      # A manual run always builds; paths-filter has nothing to compare it with.
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      fast: ${{ steps.mode.outputs.fast }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Text is ASCII apart from names, degrees and fractions
        run: node scripts/check-ascii.mjs
      - name: Colour tokens pass WCAG AA in light and dark
        run: node scripts/check-contrast.mjs
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            beyond_recipes:
              - '**'
              - '!recipes/**'
              - '!web/static/admin.json'
              - '!docs/**'
              - '!**/*.md'
      # The fast path: a manual run in fast mode, "[fast ci]" in the commit message, the fast-ci label on
      # the pull request, or a change to recipes, photos or the owner's key file only. It still checks
      # the content and builds the site.
      - id: mode
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ github.event.head_commit.message }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          BEYOND_RECIPES: ${{ steps.filter.outputs.beyond_recipes }}
        run: |
          fast=false
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$MODE" = fast ] && fast=true
          else
            case "$MESSAGE" in *'[fast ci]'*) fast=true ;; esac
            case "$LABELS" in *'"fast-ci"'*) fast=true ;; esac
            [ "$CODE" = true ] && [ "$BEYOND_RECIPES" = false ] && fast=true
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "CI mode: $([ "$fast" = true ] && echo fast || echo full)" >> "$GITHUB_STEP_SUMMARY"
      # A push that merges a pull request whose CI passed, with exactly the files that run tested (the
      # same tree as the pull request's last commit), has nothing new to test: it only builds the site
      # for the deploy. Anything else, such as main having moved on since, runs CI as usual.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          tested=false
          head=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null)][0].head.sha // empty' 2>/dev/null || true)
          if [ -n "$head" ]; then
            pushed=$(git rev-parse 'HEAD^{tree}')
            reviewed=$(gh api "repos/$REPO/git/commits/$head" --jq '.tree.sha' 2>/dev/null || true)
            passed=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$head&event=pull_request&status=success" \
              --jq '.total_count' 2>/dev/null || echo 0)
            if [ "$pushed" = "$reviewed" ] && [ "${passed:-0}" -gt 0 ]; then tested=true; fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
          if [ "$tested" = true ]; then
            echo "Already tested in the pull request (head $head): building for the deploy only." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Lints and tests run side by side; each was half of one 11-minute job.
  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fast != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The worker builds for Workers
        run: cargo build -p cookbook-worker -p cookbook-ai --target wasm32-unknown-unknown

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fast != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: nextest@0.9.148
      - run: cargo nextest run --workspace

  content:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
          save-if: false
      - run: cargo run --quiet -p cookbook-cli -- check --all

  core-artifacts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: artifacts
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz --strip-components=2 -C /usr/local/bin "binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt"
      - run: sh scripts/build-wasm.sh
      - run: cargo run --quiet -p cookbook-cli -- build
      - run: cargo run --quiet -p cookbook-cli -- cards
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code -- web/src/lib/types/recipe.ts
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: core
          path: |
            web/src/lib/wasm
            web/static/data
            web/static/cards
            web/static/img
          if-no-files-found: error
          retention-days: 1

  web:
    needs: [changes, core-artifacts]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fast != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core
          path: web
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: [changes, core-artifacts]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_PATH: /My_Cookbook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: core
          path: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: web/build
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [changes, build]
    if: needs.changes.outputs.fast != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: native
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: web/build
      - name: Every recipe is pre-rendered, searchable, and has JSON-LD and an Open Graph card
        run: cargo run --quiet -p cookbook-cli -- verify-site web/build

  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.fast != 'true' && needs.changes.outputs.tested != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_PATH: /My_Cookbook
      E2E_PREBUILT: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: web/build
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --project=chromium

  # The one check branch protection requires: a skipped job (a docs-only change, or a job the fast path
  # leaves out) counts as a pass.
  passed:
    name: CI passed
    if: always()
    needs: [changes, clippy, rust, content, core-artifacts, web, build, verify, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every CI job passed or was skipped."
