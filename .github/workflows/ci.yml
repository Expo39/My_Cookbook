name: CI

on:
  pull_request:
    branches: [main]
    # A label added or removed (fast-ci) runs CI again in the matching mode.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'full runs every job; fast checks the content, builds and deploys, skipping the Rust tests, the web checks and the browser tests'
        type: choice
        options: [full, fast]
        default: full

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.98.1
  NODE_VERSION: 24.21.0
  WASM_BINDGEN_VERSION: 0.2.129
  BINARYEN_VERSION: '128'
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      # A manual run always builds; paths-filter has nothing to compare it with.
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      fast: ${{ steps.mode.outputs.fast }}
    steps:
      - uses: actions/checkout@v7
      - name: Text is ASCII apart from names, degrees and fractions
        run: node scripts/check-ascii.mjs
      - name: Colour tokens pass WCAG AA in light and dark
        run: node scripts/check-contrast.mjs
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
            beyond_recipes:
              - '**'
              - '!recipes/**'
              - '!docs/**'
              - '!**/*.md'
      # The fast path: a manual run in fast mode, "[fast ci]" in the commit message, the fast-ci label on
      # the pull request, or a change to recipes only. It still checks the content and builds the site.
      - id: mode
        env:
          MODE: ${{ inputs.mode }}
          MESSAGE: ${{ github.event.head_commit.message }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ steps.filter.outputs.code }}
          BEYOND_RECIPES: ${{ steps.filter.outputs.beyond_recipes }}
        run: |
          fast=false
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$MODE" = fast ] && fast=true
          else
            case "$MESSAGE" in *'[fast ci]'*) fast=true ;; esac
            case "$LABELS" in *'"fast-ci"'*) fast=true ;; esac
            [ "$CODE" = true ] && [ "$BEYOND_RECIPES" = false ] && fast=true
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "CI mode: $([ "$fast" = true ] && echo fast || echo full)" >> "$GITHUB_STEP_SUMMARY"

  # Lints and tests run side by side; each was half of one 11-minute job.
  clippy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: The worker builds for Workers
        run: cargo build -p cookbook-worker -p cookbook-ai --target wasm32-unknown-unknown

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
      - run: cargo nextest run --workspace

  content:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: false
      - run: cargo run --quiet -p cookbook-cli -- check --all

  core-artifacts:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: artifacts
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN_VERSION }}
      - name: Install wasm-opt
        run: |
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | sudo tar -xz --strip-components=2 -C /usr/local/bin "binaryen-version_${BINARYEN_VERSION}/bin/wasm-opt"
      - run: sh scripts/build-wasm.sh
      - run: cargo run --quiet -p cookbook-cli -- build
      - run: cargo run --quiet -p cookbook-cli -- cards
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Generated types are up to date
        run: |
          pnpm gen:types
          git diff --exit-code -- web/src/lib/types/recipe.ts
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: core
          path: |
            web/src/lib/wasm
            web/static/data
            web/static/cards
            web/static/img
          if-no-files-found: error
          retention-days: 1

  web:
    needs: [changes, core-artifacts]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: core
          path: web
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  build:
    needs: [changes, core-artifacts]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_PATH: /My_Cookbook
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - uses: actions/download-artifact@v8
        with:
          name: core
          path: web
      - run: pnpm build
        working-directory: web
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/build
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: [changes, build]
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: web/build
      - name: Every recipe is pre-rendered, searchable, and has JSON-LD and an Open Graph card
        run: cargo run --quiet -p cookbook-cli -- verify-site web/build

  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.fast != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_PATH: /My_Cookbook
      E2E_PREBUILT: '1'
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: web/build
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm e2e --project=chromium

  # The one check branch protection requires: a skipped job (a docs-only change, or a job the fast path
  # leaves out) counts as a pass.
  passed:
    name: CI passed
    if: always()
    needs: [changes, clippy, rust, content, core-artifacts, web, build, verify, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "Every CI job passed or was skipped."
