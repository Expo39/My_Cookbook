[package]
name = "cookbook-cli"
description = "Command line tooling for the cookbook"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22.1"
clap.workspace = true
cookbook-core = { path = "../cookbook-core" }
cookbook-tree = { path = "../cookbook-tree" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
schemars = "1"
scraper = "0.27.0"
serde.workspace = true
serde_json.workspace = true
ttf-parser = "0.25.1"
webp = "0.3.1"

[dev-dependencies]
rqrr = "0.11.0"
